version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blackbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/blackbox
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/api:/app/apps/api
      - ./engine:/app/engine

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "high", "default", "low"]
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/blackbox
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/api:/app/apps/api
      - ./engine:/app/engine

  demo-api:
    build:
      context: ./fixtures/demo-api
    ports:
      - "8001:8001"
    volumes:
      - ./fixtures/demo-api:/app

volumes:
  postgres_data:
