services:
  - type: psql
    name: blackbox-db
    plan: free
    version: 15

  - type: web
    name: blackbox-api
    env: python
    buildCommand: "cd apps/api && pip install -r requirements.txt"
    startCommand: "cd apps/api && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blackbox-db
          property: connectionString
